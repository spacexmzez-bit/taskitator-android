name: Build Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - taskitator-source.zip
      - .github/workflows/android-debug.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check source archive exists
        run: |
          if [ ! -f taskitator-source.zip ]; then
            echo "::error::Upload the Android source ZIP as taskitator-source.zip at the repository root, then rerun this workflow."
            exit 1
          fi

      - name: Unpack Android source
        run: |
          mkdir -p android-source
          unzip -q taskitator-source.zip -d android-source
          test -f android-source/settings.gradle.kts || { echo "::error::Source ZIP must have settings.gradle.kts at its root."; exit 1; }
          test -f android-source/app/build.gradle.kts || { echo "::error::Source ZIP must contain app/build.gradle.kts."; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's obsolete default: "tools platform-tools".
          # Command-line tools are installed by the action itself.
          packages: 'platform-tools'

      - name: Install Android API 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Run unit tests and build debug APK
        working-directory: android-source
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -s android-source/app/build/outputs/apk/debug/app-debug.apk || { echo "::error::Build did not produce app-debug.apk."; exit 1; }
          sha256sum android-source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taskitator-debug-apk
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
