name: Taskitator Android Phase 2 build

on:
  push:
    branches: [phase2]
    paths:
      - 'phase2-source/**'
      - '.github/workflows/phase2-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Validate source archive layout
        run: |
          test -f phase2-source/settings.gradle.kts
          test -f phase2-source/app/build.gradle.kts
      - name: Run unit tests and assemble debug APK
        working-directory: phase2-source
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Package Phase 2 source and APK
        run: |
          mkdir -p dist
          cp phase2-source/app/build/outputs/apk/debug/app-debug.apk dist/taskitator-phase2-debug.apk
          cd phase2-source
          zip -qr ../dist/taskitator-phase2-source.zip . -x '*/build/*' '*/.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: taskitator-phase2-build
          path: dist/
          if-no-files-found: error
          retention-days: 30
