name: Prepare Phase 2 source inspection

on:
  push:
    branches: [phase2]
    paths:
      - .github/workflows/phase2-source-inspect.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract the Phase 1 source archive
        run: |
          set -euo pipefail
          test -s taskitator-source.zip
          mkdir -p phase2-source
          unzip -q taskitator-source.zip -d phase2-source
          test -f phase2-source/settings.gradle.kts
          test -f phase2-source/app/build.gradle.kts
          echo "Extracted files:"
          find phase2-source -type f | sort
      - name: Commit extracted source for targeted Phase 2 work
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase2-source
          git commit -m "chore: prepare Android source for Phase 2"
          git push origin HEAD:phase2
